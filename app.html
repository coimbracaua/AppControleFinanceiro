</style></head><body><header class="app-header"><div class="brand"><span class="logo">b.</span><div>bolso<small>SEU DINHEIRO, COM CLAREZA</small></div></div><!-- install-control --></header><nav class="bottom-nav" aria-label="Navegação principal"><button type="button" data-page="overview" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Início</span></button><button type="button" data-page="transactions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg><span>Lançamentos</span></button><button type="button" data-page="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span>Reservas</span></button><button type="button" data-page="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18m-5 5h2"/></svg><span>Contas</span></button><button type="button" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-.5 2-2 1-2-.5-2 3 1.5 1.5v3L2.5 15l2 3 2-.5 2 1L9 21h6l.5-2.5 2-1 2 .5 2-3-1.5-2v-3L21.5 8l-2-3-2 .5-2-1L15 3Z"/><circle cx="12" cy="12" r="3"/></svg><span>Ajustes</span></button></nav><main><div class="topbar"><span>Meu financeiro &nbsp; / &nbsp; <span id="breadcrumb">Visão geral</span></span><div class="topright"><span>Espaço pessoal</span><span class="avatar">EU</span></div></div><div id="status" role="status" class="notice">Carregando seus dados…</div><div class="heading"><div><span class="eyebrow">MAIS CLAREZA, MAIS TRANQUILIDADE</span><h1 id="title">Seu dinheiro, bem cuidado.</h1><p id="subtitle">Acompanhe o presente e planeje o que vem pela frente.</p></div><div class="actions"><input id="month" type="month" aria-label="Mês visualizado"><button id="newTx">＋ Novo lançamento</button></div></div><div id="view"></div><div class="footer"><span>bolso · Organização que cabe na sua vida.</span><span>Valores em BRL · Cadastro manual</span></div></main><dialog id="modal" class="modal"><form id="form"><div class="row"><h2 id="modalTitle"></h2><button type="button" id="closeModal" class="text" aria-label="Fechar">✕</button></div><div id="fields" class="formgrid"></div><div id="formError" role="alert"></div><div class="actions"><button type="button" id="cancel" class="secondary">Cancelar</button><button id="save" type="submit">Salvar</button></div></form></dialog><div id="toast" class="toast hidden" role="status"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),today=()=>new Date().toLocaleDateString('sv-SE'),id=()=>crypto.randomUUID();
let state={accounts:[],goals:[],transactions:[]},revision=0,page='overview',ready=false,busy=false,formAction=null,search='',filter='all';$('#month').value=today().slice(0,7);
const names={overview:['Seu dinheiro, bem cuidado.','Acompanhe o presente e planeje o que vem pela frente.','Visão geral'],transactions:['Cada movimento conta.','Seu extrato mensal, organizado do seu jeito.','Lançamentos'],goals:['Dinheiro com um propósito.','Separe hoje para realizar seus planos amanhã.','Minhas reservas'],accounts:['Tudo no mesmo lugar.','Acompanhe os saldos das suas contas e carteiras.','Minhas contas'],settings:['Do seu jeito.','Cuide dos seus dados e entenda como o Bolso funciona.','Configurações']};

const categories=['Salário','Freelance','Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Compras','Assinaturas','Reserva','Outros'];
function totals(s=state){const balances=Object.fromEntries(s.accounts.map(a=>[a.id,a.initial])),reserved=Object.fromEntries(s.accounts.map(a=>[a.id,0])),goals=Object.fromEntries(s.goals.map(g=>[g.id,0]));for(const t of s.transactions){if(t.type==='income')balances[t.account]+=t.amount;if(t.type==='expense')balances[t.account]-=t.amount;if(t.type==='reserve'||t.type==='withdraw'){const n=t.type==='reserve'?t.amount:-t.amount;reserved[t.account]+=n;goals[t.goal]+=n}}const total=Object.values(balances).reduce((a,b)=>a+b,0),saved=Object.values(goals).reduce((a,b)=>a+b,0);return{balances,reserved,goals,total,saved,available:total-saved}}
const monthly=()=>state.transactions.filter(t=>t.date.startsWith($('#month').value));const sum=(ts,type)=>ts.filter(t=>t.type===type).reduce((a,t)=>a+t.amount,0);

function table(ts,short=false){if(!ts.length)return empty('⇄','Seu próximo passo começa aqui.','Registre uma receita ou despesa para acompanhar seus movimentos neste mês.','transaction','Adicionar lançamento');return '<div class="table-wrap"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Data</th><th>Conta</th><th>Valor</th><th>Ações</th></tr></thead><tbody>'+[...ts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,short?5:10000).map(t=>'<tr><td>'+esc(t.description)+'<br><small style="color:var(--muted);font-weight:400">'+types[t.type]+'</small></td><td><span class="tag">'+esc(t.category)+'</span></td><td>'+t.date.split('-').reverse().join('/')+'</td><td>'+esc(state.accounts.find(a=>a.id===t.account)?.name)+'</td><td class="'+(t.type==='income'?'positive':t.type==='expense'?'negative':'')+'">'+(t.type==='income'?'+ ':t.type==='expense'?'− ':'')+money(t.amount)+'</td><td><button class="text" data-edit-tx="'+t.id+'" aria-label="Editar '+esc(t.description)+'">✎</button><button class="text danger" data-delete-tx="'+t.id+'" aria-label="Excluir '+esc(t.description)+'">×</button></td></tr>').join('')+'</tbody></table></div>'}
function chart(){let months=[];const base=new Date($('#month').value+'-01T12:00:00');for(let n=5;n>=0;n--){const d=new Date(base);d.setMonth(d.getMonth()-n);const key=d.toLocaleDateString('sv-SE').slice(0,7),tx=state.transactions.filter(t=>t.date.startsWith(key));months.push({label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),inc:sum(tx,'income'),exp:sum(tx,'expense')})}const max=Math.max(1,...months.flatMap(m=>[m.inc,m.exp]));return '<div class="chart" role="img" aria-label="Receitas e despesas dos últimos seis meses">'+months.map(m=>'<div class="bar-group" title="'+m.label+': receitas '+money(m.inc)+', despesas '+money(m.exp)+'"><div class="bar" style="height:'+m.inc/max*100+'%"></div><div class="bar exp" style="height:'+m.exp/max*100+'%"></div><span class="chartlabel">'+m.label+'</span></div>').join('')+'</div>'}
function render(){const t=totals(),ts=monthly(),inc=sum(ts,'income'),exp=sum(ts,'expense');$('#title').textContent=names[page][0];$('#subtitle').textContent=names[page][1];$('#breadcrumb').textContent=names[page][2];document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#month').classList.toggle('hidden',['accounts','goals','settings'].includes(page));$('#newTx').disabled=!ready;let html='';
if(page==='overview')html='<section class="hero"><div><span class="eyebrow">CADA PLANO TEM SEU LUGAR</span><h2><span>Organize hoje.</span><span>Realize amanhã.</span></h2><p>Dê um propósito ao seu dinheiro com reservas para o que importa.</p></div><div class="hero-art" aria-hidden="true"><div class="stem"></div><div class="coin">$</div></div></section><section class="cards">'+[['Saldo total',money(t.total),'Todas as contas · acumulado'],['Disponível para usar',money(t.available),'Saldo total menos suas reservas'],['Dinheiro reservado',money(t.saved),state.goals.length+' objetivos criados'],['Resultado do mês',money(inc-exp),'Receitas − despesas do mês selecionado']].map((x,i)=>'<div class="card '+(i===1?'emphasis':'')+'"><h2 class="kpi-title">'+x[0]+'</h2><div class="value kpi-value">'+x[1]+'</div><p class="kpi-subtitle">'+x[2]+'</p></div>').join('')+'</section><div class="grid"><section class="panel"><div class="panelhead"><div><h2>Seu dinheiro em movimento</h2><p>Receitas e despesas · últimos 6 meses</p></div><div class="legend"><span><i class="dot"></i>Receitas</span><span><i class="dot out"></i>Despesas</span></div></div>'+chart()+'<div class="chartnote"><span>Entrou no mês <strong class="positive">'+money(inc)+'</strong></span><span>Saiu no mês <strong>'+money(exp)+'</strong></span></div></section><section class="panel"><div class="panelhead"><div><h2>Seus planos ganhando forma</h2><p>Um pouco hoje, mais perto amanhã.</p></div><button class="text" data-page="goals">Ver todos ↗</button></div>'+(state.goals.length?state.goals.slice(0,3).map(progress).join(''):empty('◎','Qual é o seu próximo plano?','Uma viagem, sua casa ou tranquilidade para imprevistos. Crie sua primeira reserva.','goal','＋ Criar reserva'))+'</section></div><section class="panel"><div class="panelhead"><div><h2>Últimos movimentos</h2><p>Os lançamentos mais recentes do mês selecionado.</p></div><button class="text" data-page="transactions">Ver extrato ↗</button></div>'+table(ts,true)+'</section>';
if(page==='transactions')html='<section class="panel"><div class="panelhead"><div><h2>Extrato mensal</h2><p>'+ts.length+' lançamentos · Receitas '+money(inc)+' · Despesas '+money(exp)+'</p></div><button class="secondary" data-action="csv">↓ Exportar CSV</button></div><div class="filters"><input id="search" type="search" placeholder="Buscar descrição ou categoria…" aria-label="Buscar lançamentos" value="'+esc(search)+'"><select id="typeFilter" aria-label="Filtrar por tipo">'+[['all','Todos os tipos'],...Object.entries(types)].map(([v,l])=>'<option value="'+v+'" '+(filter===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div id="results">'+table(filtered())+'</div></section>';
if(page==='goals')html='<div class="notice">O dinheiro reservado continua nas suas contas. Aportes e resgates apenas alteram a parte disponível para usar.</div><div class="panelhead"><h2>'+state.goals.length+' reservas · '+money(t.saved)+' guardados</h2><button data-action="goal">＋ Nova reserva</button></div><div class="goals-grid">'+(state.goals.length?state.goals.map(g=>'<section class="panel goal-card"><div class="row"><span class="goal-icon">'+esc(g.icon||'◎')+'</span><div><button class="text" data-edit-goal="'+g.id+'" aria-label="Editar reserva">✎</button><button class="text danger" data-delete-goal="'+g.id+'" aria-label="Excluir reserva">×</button></div></div><h3>'+esc(g.name)+'</h3><p>'+esc(g.reason||'Um plano que merece acontecer.')+'</p><div class="value">'+money(t.goals[g.id])+'</div><p>Objetivo: '+money(g.target)+(g.deadline?' · Até '+g.deadline.split('-').reverse().join('/'):'')+'</p>'+progress(g)+'<div class="actions"><button data-reserve="'+g.id+'">＋ Guardar</button><button class="secondary" data-withdraw="'+g.id+'">Resgatar</button></div></section>').join(''):'<section class="panel">'+empty('◎','Faça espaço para seus planos.','Crie reservas com metas e motivos diferentes.','goal','Criar primeira reserva')+'</section>')+'</div>';
if(page==='accounts')html='<div class="panelhead"><h2>Saldo total: '+money(t.total)+'</h2><button data-action="account">＋ Nova conta</button></div><div class="account-grid">'+(state.accounts.length?state.accounts.map(a=>'<section class="panel"><div class="row"><span class="badge">▤</span><div><button class="text" data-edit-account="'+a.id+'" aria-label="Editar conta">✎</button><button class="text danger" data-delete-account="'+a.id+'" aria-label="Excluir conta">×</button></div></div><h3 style="margin-top:18px">'+esc(a.name)+'</h3><div class="value">'+money(t.balances[a.id])+'</div><p style="font-size:12px">Reservado: '+money(t.reserved[a.id])+'<br>Disponível: '+money(t.balances[a.id]-t.reserved[a.id])+'</p></section>').join(''):'<section class="panel">'+empty('▤','Vamos começar pela sua conta?','Cadastre seu banco ou sua carteira e informe o saldo inicial.','account','＋ Adicionar conta')+'</section>')+'</div>';
if(page==='settings')html='<div class="settings"><section class="panel"><h2>Seus dados, sob seu controle</h2><p>Os registros são salvos no banco de dados deste espaço privado, associados à sua conta. Exporte uma cópia de segurança para guardar seus dados.</p><div class="actions"><button data-action="backup">↓ Exportar backup</button><button class="secondary" data-action="import">↑ Restaurar backup</button></div><input class="hidden" id="importFile" type="file" accept="application/json"></section><section class="panel"><h2>Como o Bolso calcula</h2><p><strong>Saldo total:</strong> saldos iniciais + receitas − despesas.<br><strong>Reservado:</strong> aportes − resgates de todos os objetivos.<br><strong>Disponível:</strong> saldo total − dinheiro reservado.<br><strong>Resultado mensal:</strong> receitas − despesas do mês selecionado.</p><p>O saldo total é acumulado e inclui todos os lançamentos cadastrados. Aportes e resgates são separações virtuais: não movimentam dinheiro no seu banco. Para gastar uma reserva, registre um resgate antes da despesa.</p></section><section class="panel"><h2>Sobre este ambiente</h2><p>Moeda: real brasileiro (BRL). Cadastro manual de contas e lançamentos. O extrato pode ser filtrado por mês e exportado em CSV. O Bolso não se conecta automaticamente a bancos.</p><a href="/signout-with-chatgpt?return_to=/" target="_top" style="color:var(--green)">Sair da conta ↗</a></section></div>';
$('#view').innerHTML=html;}
function filtered(){return monthly().filter(t=>(filter==='all'||t.type===filter)&&[t.description,t.category].join(' ').toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR')))}
async function persist(next){if(!ready)throw Error('Aguarde o carregamento dos dados.');if(busy)throw Error('Aguarde o salvamento em andamento.');busy=true;try{const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:next,revision})}),v=await r.json();if(!r.ok)throw Error(v.error||'Não foi possível salvar.');state=next;revision=v.revision;render();toast('Salvo. Mais um passo para se organizar.')}finally{busy=false}}
function field(label,name,type='text',value='',extra=''){return '<label class="field '+(type==='text'?'wide':'')+'">'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+' required></label>'}
function select(label,name,options,value){return '<label class="field wide">'+label+'<select name="'+name+'">'+options.map(([v,l])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select></label>'}
function cents(v){const n=Number(v);if(!Number.isFinite(n)||n<0||Math.abs(n*100-Math.round(n*100))>.00001)throw Error('Use um valor com até duas casas decimais.');return Math.round(n*100)}
function openForm(title,fields,fn){if(!ready)return toast('Aguarde o carregamento ou entre na sua conta.');$('#form').reset();$('#modalTitle').textContent=title;$('#fields').innerHTML=fields;$('#formError').textContent='';formAction=fn;$('#modal').showModal()}
function account(existing){const a=existing||{};openForm(a.id?'Editar conta':'Nova conta',field('Nome da conta','name','text',a.name||'','maxlength="80" placeholder="Ex.: Nubank, carteira…"')+field('Saldo inicial (R$)','initial','number',(a.initial||0)/100,'min="0" step="0.01"')+'<p class="help wide">Informe o saldo antes dos lançamentos que irá cadastrar. Não registre esse valor novamente como receita.</p>',async f=>{const next=structuredClone(state),value={id:a.id||id(),name:f.get('name').trim(),initial:cents(f.get('initial'))};if(a.id)next.accounts=next.accounts.map(x=>x.id===a.id?value:x);else next.accounts.push(value);await persist(next)})}
function goal(existing){const g=existing||{};openForm(g.id?'Editar reserva':'Uma nova reserva',field('Nome do objetivo','name','text',g.name||'','maxlength="80" placeholder="Ex.: Reserva de emergência"')+field('Motivo','reason','text',g.reason||'','maxlength="150" placeholder="Por que você quer guardar?"')+field('Meta (R$)','target','number',g.target?g.target/100:'','min="0.01" step="0.01"')+'<label class="field">Prazo (opcional)<input name="deadline" type="date" value="'+esc(g.deadline||'')+'"></label>'+select('Símbolo','icon',[['◎','◎ Objetivo'],['✈','✈ Viagem'],['⌂','⌂ Casa'],['♡','♡ Tranquilidade'],['✦','✦ Novo plano']],g.icon||'◎'),async f=>{const next=structuredClone(state),value={id:g.id||id(),name:f.get('name').trim(),reason:f.get('reason').trim(),target:cents(f.get('target')),deadline:f.get('deadline'),icon:f.get('icon')};if(g.id)next.goals=next.goals.map(x=>x.id===g.id?value:x);else next.goals.push(value);await persist(next)})}
function transaction(existing,goalId,type){if(!state.accounts.length){toast('Primeiro, adicione uma conta.');return account()}const t=existing||{type:type||'expense',goal:goalId,account:state.accounts[0].id,date:today()};openForm(t.id?'Editar lançamento':'Novo lançamento',select('Tipo','type',Object.entries(types),t.type)+field('Descrição','description','text',t.description||'','maxlength="150" placeholder="Ex.: Salário, supermercado…"')+field('Valor (R$)','amount','number',t.amount?t.amount/100:'','min="0.01" step="0.01"')+field('Data','date','date',t.date)+select('Conta','account',state.accounts.map(a=>[a.id,a.name]),t.account)+select('Categoria','category',categories.map(c=>[c,c]),t.category||(['reserve','withdraw'].includes(t.type)?'Reserva':'Outros'))+'<div class="wide" id="goalField">'+select('Reserva','goal',state.goals.map(g=>[g.id,g.name]),t.goal)+'</div><p class="help wide" id="txHelp"></p>',async f=>{const next=structuredClone(state),kind=f.get('type');if(['reserve','withdraw'].includes(kind)&&!f.get('goal'))throw Error('Crie uma reserva antes de fazer aportes ou resgates.');const value={id:t.id||id(),type:kind,description:f.get('description').trim(),amount:cents(f.get('amount')),date:f.get('date'),account:f.get('account'),category:f.get('category'),goal:['reserve','withdraw'].includes(kind)?f.get('goal'):null};if(t.id)next.transactions=next.transactions.map(x=>x.id===t.id?value:x);else next.transactions.push(value);await persist(next)});updateTx()}
function updateTx(){const el=$('#form select[name=type]');if(!el)return;const reserve=['reserve','withdraw'].includes(el.value);$('#goalField').classList.toggle('hidden',!reserve);$('#txHelp').textContent=reserve?'Aportes e resgates não alteram o saldo total da conta. Resgate da mesma conta onde o dinheiro foi reservado.':'O valor será somado ou descontado do saldo da conta.'}
async function remove(kind,key){if(!confirm('Excluir este registro? Essa ação altera seus saldos.'))return;const next=structuredClone(state);if(kind==='accounts'&&next.transactions.some(t=>t.account===key))return toast('Esta conta possui lançamentos. Exclua ou altere os lançamentos primeiro.');if(kind==='goals'&&next.transactions.some(t=>t.goal===key))return toast('Esta reserva possui movimentações. Exclua ou altere os lançamentos primeiro.');next[kind]=next[kind].filter(x=>x.id!==key);try{await persist(next)}catch(e){toast(e.message)}}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(){const rows=[['Data','Descrição','Tipo','Categoria','Conta','Reserva','Valor (BRL)'],...filtered().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.description,types[t.type],t.category,state.accounts.find(a=>a.id===t.account)?.name,state.goals.find(g=>g.id===t.goal)?.name||'',((t.type==='expense'?-t.amount:t.amount)/100).toFixed(2).replace('.',',')])];const safe=v=>'"'+String(v).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';download('bolso-extrato-'+$('#month').value+'.csv','\ufeff'+rows.map(r=>r.map(safe).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}const action=b.dataset.action;if(action==='account')account();if(action==='goal')goal();if(action==='transaction')transaction();if(action==='csv')csv();if(action==='backup')download('bolso-backup-'+today()+'.json',JSON.stringify({format:'bolso-v1',data:state},null,2),'application/json');if(action==='import')$('#importFile').click();for(const [key,list,fn]of[['editAccount','accounts',account],['editGoal','goals',goal],['editTx','transactions',transaction]])if(b.dataset[key])fn(state[list].find(x=>x.id===b.dataset[key]));for(const [key,list]of[['deleteAccount','accounts'],['deleteGoal','goals'],['deleteTx','transactions']])if(b.dataset[key])remove(list,b.dataset[key]);if(b.dataset.reserve)transaction(null,b.dataset.reserve,'reserve');if(b.dataset.withdraw)transaction(null,b.dataset.withdraw,'withdraw')});
$('#newTx').onclick=()=>transaction();$('#month').onchange=()=>{if(!$('#month').value)$('#month').value=today().slice(0,7);render()};$('#cancel').onclick=$('#closeModal').onclick=()=>$('#modal').close();$('#form').onchange=updateTx;
$('#form').onsubmit=async e=>{e.preventDefault();$('#save').disabled=true;$('#formError').textContent='';try{await formAction(new FormData(e.target));$('#modal').close()}catch(err){$('#formError').textContent=err.message}finally{$('#save').disabled=false}};
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('#results').innerHTML=table(filtered())}});document.addEventListener('change',async e=>{if(e.target.id==='typeFilter'){filter=e.target.value;$('#results').innerHTML=table(filtered())}if(e.target.id==='importFile'){try{const file=e.target.files[0];if(!file)return;if(file.size>4000000)throw Error('O backup excede 4 MB.');const backup=JSON.parse(await file.text());if(backup.format!=='bolso-v1')throw Error('Selecione um backup exportado pelo Bolso.');if(confirm('Restaurar este backup? Todos os registros atuais serão substituídos.'))await persist(backup.data)}catch(err){toast(err.message)}}});
async function load(){try{const r=await fetch('/api/state'),v=await r.json();if(r.status===401){$('#status').innerHTML='Seu espaço está pronto. <a href="/signin-with-chatgpt?return_to=/" target="_top">Entre com sua conta para começar ↗</a>';return}if(!r.ok)throw Error(v.error||'Não foi possível carregar.');state=v.data;revision=v.revision;ready=true;$('#status').classList.add('hidden');render()}catch(e){$('#status').classList.add('error');$('#status').textContent='Não foi possível carregar seus dados. Recarregue a página para tentar novamente.'}}
render();load();
</script></body></html>
